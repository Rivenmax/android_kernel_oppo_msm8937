name: Build SukiSU A57
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-21

      - name: Patch SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          echo "CONFIG_KSU=y" >> arch/arm64/configs/lineageos_A57_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/lineageos_A57_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/lineageos_A57_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/lineageos_A57_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/lineageos_A57_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/lineageos_A57_defconfig

      - name: Build Kernel
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld gcc-aarch64-linux-gnu
          make lineageos_A57_defconfig ARCH=arm64
          make -j$(nproc) ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-A57-Image
          path: arch/arm64/boot/Image.gz-dtb
