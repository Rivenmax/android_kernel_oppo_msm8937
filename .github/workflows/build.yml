name: Build SukiSU A57 FINAL FIX

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-21
          fetch-depth: 0

      - name: Patch SukiSU Ultra for 4.9.337
        run: |
          # SukiSU Ultra main sekarang buat 5.10+ GKI, buat 4.9 pake tag lama
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.1.7 || bash -s v3.1.5

      - name: Set Defconfig A57
        run: |
          DEFCONFIG=arch/arm64/configs/lineageos_A57_defconfig
          if [ ! -f $DEFCONFIG ]; then DEFCONFIG=arch/arm64/configs/lineageos_R9s_defconfig; fi
          echo "Using $DEFCONFIG"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> $DEFCONFIG
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> $DEFCONFIG
          echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO_DWARF4 is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> $DEFCONFIG
          echo "# CONFIG_GDB_SCRIPTS is not set" >> $DEFCONFIG
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' $DEFCONFIG || true

      - name: Setup Clang FAST
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Build Kernel A57
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          # pake -j1 dulu biar error keliatan jelas, kalau udah ijo ganti jadi -j$(nproc)
          make O=out -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-g0 -fno-asynchronous-unwind-tables" 2>&1 | tee build.log || (echo "---- LAST 200 LINES ERROR ----" && tail -n 300 build.log && exit 1)

      - name: Make 【entity-TWRP¦canonical_name=TWRP】 ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/test-keys/release-keys/g' anykernel.sh 2>/dev/null || true
          zip -r9 ../SukiSU-A57-FAST-【entity-TWRP¦canonical_name=TWRP】.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload FAST
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-A57-FAST
          path: |
            SukiSU-A57-FAST-【entity-TWRP¦canonical_name=TWRP】.zip
            out/arch/arm64/boot/Image.gz-dtb
