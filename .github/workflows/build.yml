name: Build A57 SukiSU v3.2.4 1x JADI

permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lineage-21
          fetch-depth: 0

      - name: Patch SukiSU Ultra v3.2.4
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.4

      - name: BABAT infra + extension - FIX FOTO 20.05
        run: |
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/core/init.c || true
          for f in drivers/kernelsu/infra/*.c; do echo "/* disabled for 4.9.337 */ #include <linux/kernel.h>" > "$f"; done
          cat > drivers/kernelsu/infra/Makefile << 'EOF'
          obj-y :=
          EOF
          cat > drivers/kernelsu/infra/Kbuild << 'EOF'
          obj-y :=
          EOF
          for f in drivers/kernelsu/extension/*.c; do echo "/* disabled for 4.9.337 - vdso/datapage.h 5.10+ */ #include <linux/kernel.h>" > "$f"; done
          cat > drivers/kernelsu/extension/Makefile << 'EOF'
          obj-y :=
          EOF
          cat > drivers/kernelsu/extension/Kbuild << 'EOF'
          obj-y :=
          EOF
          cat > drivers/kernelsu/manager/pkg_observer.c << 'EOF'
          /* disabled */
          #include <linux/kernel.h>
          void ksu_pkg_observer_init(void) {}
          void ksu_pkg_observer_exit(void) {}
          EOF
          cat > drivers/kernelsu/policy/allowlist.c << 'EOF'
          /* disabled */
          #include <linux/kernel.h>
          void ksu_allowlist_init(void) {}
          void ksu_allowlist_exit(void) {}
          bool ksu_is_allowlist_enabled(void) { return false; }
          EOF
          cat > drivers/kernelsu/policy/app_profile.c << 'EOF'
          /* disabled */
          #include <linux/kernel.h>
          void ksu_app_profile_init(void) {}
          void ksu_app_profile_exit(void) {}
          EOF
          cat > drivers/kernelsu/hook/syscall_hook.h << 'EOF'
          #ifndef _KSU_SYSCALL_HOOK_H
          #define _KSU_SYSCALL_HOOK_H
          #include <linux/ptrace.h>
          typedef long (*syscall_fn_t)(const struct pt_regs *);
          extern syscall_fn_t *ksu_syscall_table;
          void ksu_syscall_table_hook(int nr, syscall_fn_t fn, syscall_fn_t *old);
          void ksu_syscall_table_unhook(int nr, syscall_fn_t *old);
          void ksu_syscall_table_hook_init(void);
          void ksu_syscall_hook_init(void);
          void ksu_register_syscall_hook(int nr, void *fn);
          void ksu_unregister_syscall_hook(int nr);
          void ksu_syscall_hook_exit(void);
          #endif
          EOF
          mkdir -p include/linux
          echo "#include <linux/compiler.h>" > include/linux/compiler_types.h
          printf "#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#include <linux/mm.h>\n#endif\n" > include/linux/pgtable.h
          mkdir -p include/linux/sched
          echo "#include <linux/sched.h>" > include/linux/sched/task_stack.h
          echo "#include <linux/sched.h>" > include/linux/sched/signal.h
          echo "#include <linux/sched.h>" > include/linux/sched/task.h
          echo "#include <linux/sched.h>" > include/linux/sched/mm.h
          echo "#include <linux/sched.h>" > include/linux/sched/user.h
          cat > drivers/kernelsu/hook/arm64/syscall_hook.c << 'EOF'
          /* disabled */
          #include <linux/kernel.h>
          EOF
          cat > drivers/kernelsu/hook/arm64/patch_memory.c << 'EOF'
          /* disabled */
          #include <linux/kernel.h>
          #include <linux/mm.h>
          void ksu_patch_memory(void *addr, void *data, size_t len) {}
          void ksu_memory_patch_init(void) {}
          EOF
          rm -f drivers/kernelsu/feature/sucompat.c drivers/kernelsu/feature/sulog.c
          echo "/* disabled */" > drivers/kernelsu/feature/sucompat.c
          echo "/* disabled */" > drivers/kernelsu/feature/sulog.c
          echo "/* disabled */" > drivers/kernelsu/hook/lsm_hook.c
          echo "/* disabled */" > drivers/kernelsu/hook/setuid_hook.c
          echo "/* disabled */" > drivers/kernelsu/hook/syscall_event_bridge.c
          echo "/* disabled */" > drivers/kernelsu/hook/syscall_hook_manager.c
          echo "/* disabled */" > drivers/kernelsu/hook/tp_marker.c
          cat > drivers/kernelsu/hook/Makefile << 'EOF'
          obj-y += fs_hook.o
          obj-y += syscall_hook.o
          obj-y += arm64/
          EOF
          cat > drivers/kernelsu/hook/Kbuild << 'EOF'
          obj-y += fs_hook.o
          obj-y += syscall_hook.o
          obj-y += arm64/
          EOF
          cat > drivers/kernelsu/hook/arm64/Makefile << 'EOF'
          obj-y += patch_memory.o
          EOF
          cat > drivers/kernelsu/hook/arm64/Kbuild << 'EOF'
          obj-y += patch_memory.o
          EOF
          cat > drivers/kernelsu/hook/syscall_hook.c << 'EOF'
          #include "syscall_hook.h"
          #include <linux/ptrace.h>
          void ksu_syscall_hook_init(void) {}
          void ksu_syscall_table_hook_init(void) {}
          void ksu_syscall_table_hook(int nr, syscall_fn_t fn, syscall_fn_t *old) {}
          void ksu_syscall_table_unhook(int nr, syscall_fn_t *old) {}
          void ksu_register_syscall_hook(int nr, void *fn) {}
          void ksu_unregister_syscall_hook(int nr) {}
          void ksu_syscall_hook_exit(void) {}
          long ksu_hook_setresuid(const struct pt_regs *regs) { return 0; }
          EOF

      - name: Set Defconfig
        run: |
          DEFCONFIG=arch/arm64/configs/lineageos_A57_defconfig
          if [ ! -f $DEFCONFIG ]; then DEFCONFIG=arch/arm64/configs/lineageos_R9s_defconfig; fi
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "# CONFIG_KPM is not set" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> $DEFCONFIG
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO is not set" >> $DEFCONFIG
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' $DEFCONFIG || true

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v5
        with:
          path: ~/clang
          key: clang-324-foto2005

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          git clone https://github.[STRIPPED 66 bytes] --depth=1 $HOME/clang || git clone https://github.com/kdrag0n/proton-clang --depth=1 $HOME/clang

      - name: Setup Toolchains
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel 3.2.4
        run: |
          export ARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          make O=out -j1 ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-g0"

      - name: Make TWRP ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          ls -lh out/arch/arm64/boot/
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/test-keys/release-keys/g' anykernel.sh
          zip -r9 ../A57-SUKISU-v3.2.4-1x-JADI-TWRP.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: A57-SUKISU-v3.2.4-1x-JADI
          path: |
            A57-SUKISU-v3.2.4-1x-JADI-TWRP.zip
            out/arch/arm64/boot/Image*
