name: Build A57 SukiSU v3.2.4 FULL MIRROR

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lineage-21
          fetch-depth: 0

      - name: Patch SukiSU Ultra v3.2.4 FULL
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.4

      - name: Set Defconfig v3.2.4 FULL FIX
        run: |
          DEFCONFIG=arch/arm64/configs/lineageos_A57_defconfig
          if [ ! -f $DEFCONFIG ]; then DEFCONFIG=arch/arm64/configs/lineageos_R9s_defconfig; fi
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "# CONFIG_KPM is not set" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> $DEFCONFIG
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO is not set" >> $DEFCONFIG
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' $DEFCONFIG || true

      - name: Cache Clang FULL
        id: cache-clang
        uses: actions/cache@v5
        with:
          path: ~/clang
          key: clang-r536225-mirror-v324-fix

      - name: Download Clang FULL MIRROR
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          echo "Mirror 1: LineageOS 【entity-Github¦canonical_name=Github】 (anti DNS fail foto 00.41)"
          if ! git clone https://github.[STRIPPED 66 bytes] --depth=1 $HOME/clang 2>&1; then
            echo "Mirror 1 failed, Mirror 2: 【entity-Proton¦canonical_name=Proton】"
            rm -rf $HOME/clang
            git clone https://github.com/kdrag0n/proton-clang --depth=1 $HOME/clang
          fi

      - name: Setup Toolchains + PATH
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          $HOME/clang/bin/clang --version || clang --version

      - name: Build Kernel v3.2.4 FULL
        run: |
          export ARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          make O=out -j1 ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-g0" 2>&1 | tee build.log || ( tail -n 300 build.log && exit 2 )

      - name: Make TWRP ZIP v3.2.4 FULL
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/test-keys/release-keys/g' anykernel.sh
          zip -r9 ../A57-SUKISU-v3.2.4-FULL-TWRP.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload v3.2.4 FULL
        uses: actions/upload-artifact@v5
        with:
          name: A57-SUKISU-v3.2.4-FULL
          path: |
            A57-SUKISU-v3.2.4-FULL-TWRP.zip
            out/arch/arm64/boot/Image.gz-dtb
