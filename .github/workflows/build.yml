name: Build A57 SukiSU v3.2.4 1x JADI
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lineage-21
          fetch-depth: 0
      - name: Patch SukiSU v3.2.4
        run: curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.4
      - name: BABAT TOTAL FIX selinux_state FOTO 01.02
        run: |
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/core/init.c || true
          for d in infra extension runtime selinux sulog supercall; do for f in drivers/kernelsu/$d/*.c; do [ -f "$f" ] && echo "/* disabled */ #include <linux/kernel.h>" > "$f"; done; for f in drivers/kernelsu/$d/*/*.c; do [ -f "$f" ] && echo "/* disabled */ #include <linux/kernel.h>" > "$f"; done; echo "obj-y :=" > drivers/kernelsu/$d/Makefile; echo "obj-y :=" > drivers/kernelsu/$d/Kbuild; done
          cat > drivers/kernelsu/supercall/supercall.c << 'EOF'
          #include <linux/kernel.h>
          void ksu_supercall_init(void) {} void ksu_supercall_exit(void) {} long ksu_handle_supercall(void *a, void *b) { return 0; }
          EOF
          cat > drivers/kernelsu/manager/pkg_observer.c << 'EOF'
          #include <linux/kernel.h>
          void ksu_pkg_observer_init(void) {} void ksu_pkg_observer_exit(void) {}
          EOF
          cat > drivers/kernelsu/policy/allowlist.c << 'EOF'
          #include <linux/kernel.h>
          #include <stdbool.h>
          void ksu_allowlist_init(void) {} void ksu_allowlist_exit(void) {} bool ksu_is_allowlist_enabled(void) { return false; }
          EOF
          cat > drivers/kernelsu/policy/app_profile.c << 'EOF'
          #include <linux/kernel.h>
          void ksu_app_profile_init(void) {} void ksu_app_profile_exit(void) {}
          EOF
          mkdir -p include/linux; echo "#include <linux/compiler.h>" > include/linux/compiler_types.h; printf "#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#include <linux/mm.h>\n#endif\n" > include/linux/pgtable.h; printf "#ifndef _LINUX_MINMAX_H\n#define _LINUX_MINMAX_H\n#include <linux/kernel.h>\n#endif\n" > include/linux/minmax.h
          cat > include/linux/selinux_state.h << 'EOF'
          #ifndef _LINUX_SELINUX_STATE_H
          #define _LINUX_SELINUX_STATE_H
          struct selinux_state { int dummy; bool enforcing; };
          extern struct selinux_state selinux_state;
          struct selinux_state selinux_state;
          #endif
          EOF
          mkdir -p include/linux/sched; for h in task_stack signal task mm user; do echo "#include <linux/sched.h>" > include/linux/sched/$h.h; done
          grep -rIl "selinux_state" drivers/kernelsu/ 2>/dev/null | xargs -r sed -i '1i #include <linux/selinux_state.h>' || true
          cat > drivers/kernelsu/hook/arm64/syscall_hook.c << 'EOF'
          #include <linux/kernel.h>
          EOF
          cat > drivers/kernelsu/hook/arm64/patch_memory.c << 'EOF'
          #include <linux/kernel.h>
          #include <linux/mm.h>
          void ksu_patch_memory(void *a, void *b, size_t c) {} void ksu_memory_patch_init(void) {}
          EOF
          for f in feature/sucompat.c feature/sulog.c hook/lsm_hook.c hook/setuid_hook.c hook/syscall_event_bridge.c hook/syscall_hook_manager.c hook/tp_marker.c; do echo "/* disabled */" > drivers/kernelsu/$f; done
          printf "obj-y += fs_hook.o\nobj-y += syscall_hook.o\nobj-y += arm64/\n" > drivers/kernelsu/hook/Makefile; printf "obj-y += fs_hook.o\nobj-y += syscall_hook.o\nobj-y += arm64/\n" > drivers/kernelsu/hook/Kbuild; echo "obj-y += patch_memory.o" > drivers/kernelsu/hook/arm64/Makefile; echo "obj-y += patch_memory.o" > drivers/kernelsu/hook/arm64/Kbuild
          cat > drivers/kernelsu/hook/syscall_hook.h << 'EOF'
          #ifndef _KSU_SYSCALL_HOOK_H
          #define _KSU_SYSCALL_HOOK_H
          #include <linux/ptrace.h>
          typedef long (*syscall_fn_t)(const struct pt_regs *);
          void ksu_syscall_table_hook(int nr, syscall_fn_t fn, syscall_fn_t *old); void ksu_syscall_table_unhook(int nr, syscall_fn_t *old); void ksu_syscall_table_hook_init(void); void ksu_syscall_hook_init(void); void ksu_register_syscall_hook(int nr, void *fn); void ksu_unregister_syscall_hook(int nr); void ksu_syscall_hook_exit(void);
          #endif
          EOF
          cat > drivers/kernelsu/hook/syscall_hook.c << 'EOF'
          #include "syscall_hook.h"
          #include <linux/ptrace.h>
          void ksu_syscall_hook_init(void) {} void ksu_syscall_table_hook_init(void) {} void ksu_syscall_table_hook(int nr, syscall_fn_t fn, syscall_fn_t *old) {} void ksu_syscall_table_unhook(int nr, syscall_fn_t *old) {} void ksu_register_syscall_hook(int nr, void *fn) {} void ksu_unregister_syscall_hook(int nr) {} void ksu_syscall_hook_exit(void) {} long ksu_hook_setresuid(const struct pt_regs *regs) { return 0; }
          EOF
          cat > drivers/kernelsu/ksu_stub_4_9.c << 'EOF'
          #include <linux/kernel.h>
          void ksu_handle_execveat_ksud(int a, void *b) {} void ksu_handle_fork(void *a) {} void ksu_handle_exit(void) {} int ksu_handle_prctl(int a, unsigned long b, unsigned long c, unsigned long d, unsigned long e) { return 0; } void ksu_sulog_init(void) {} void ksu_sulog_exit(void) {} void ksu_sucompat_init(void) {} void ksu_sucompat_exit(void) {} bool ksu_is_ksud_should_umount(void) { return false; } void ksu_supercall_init(void) {} void ksu_supercall_exit(void) {}
          EOF
          grep -q "ksu_stub" drivers/kernelsu/Makefile || echo "obj-y += ksu_stub_4_9.o" >> drivers/kernelsu/Makefile
      - name: Set Defconfig
        run: |
          D=arch/arm64/configs/lineageos_A57_defconfig; [ -f $D ] || D=arch/arm64/configs/lineageos_R9s_defconfig
          echo "CONFIG_KSU=y" >> $D; echo "CONFIG_KSU_MANUAL_HOOK=y" >> $D; echo "# CONFIG_KPM is not set" >> $D; echo "# CONFIG_DEBUG_INFO is not set" >> $D; sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' $D || true
      - name: Cache Clang FULL
        id: cache-clang
        uses: actions/cache@v5
        with:
          path: ~/clang
          key: clang-r536225-foto0736
      - name: Download Clang FULL MIRROR
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          rm -rf $HOME/clang; mkdir -p $HOME/clang
          git clone https://github.[STRIPPED 66 bytes] --depth=1 $HOME/clang || { rm -rf $HOME/clang; git clone https://github.com/kdrag0n/proton-clang --depth=1 $HOME/clang; }
      - name: Setup Toolchains
        run: |
          sudo apt-get update -q; sudo apt-get install -y -q gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev
          echo "$HOME/clang/bin" >> $GITHUB_PATH
      - name: Build Kernel 3.2.4 1x JADI
        run: |
          export ARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR --disable CONFIG_CC_STACKPROTECTOR_STRONG --disable CONFIG_CC_STACKPROTECTOR_REGULAR --enable CONFIG_CC_STACKPROTECTOR_NONE
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO --disable CONFIG_DEBUG_INFO_DWARF4
          make O=out olddefconfig
          make O=out -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-g0 -w -include linux/selinux_state.h"
      - name: Make TWRP ZIP
        if: success()
        run: |
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-g0 -w -include linux/selinux_state.h" Image.gz-dtb -j$(nproc) || true
          IMG=$(find out -name "Image.gz-dtb" | head -n 1); [ -z "$IMG" ] && IMG=$(find out -name "Image.gz" | head -n 1); [ -z "$IMG" ] && IMG=$(find out -name "Image" -type f | head -n 1)
          ls -lh $IMG
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp $IMG AnyKernel3/
          cd AnyKernel3; zip -r9 ../A57-SUKISU-v3.2.4-1x-JADI-TWRP.zip * -x .git README.md *placeholder; cd ..
      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: A57-SUKISU-v3.2.4-1x-JADI-TWRP
          path: A57-SUKISU-v3.2.4-1x-JADI-TWRP.zip
