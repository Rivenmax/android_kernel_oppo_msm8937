name: Build A57 KSU 0.9.5 FAST - FINAL

permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lineage-21
          fetch-depth: 0

      - name: Patch KernelSU 0.9.5 for 4.9
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Set Defconfig
        run: |
          DEFCONFIG=arch/arm64/configs/lineageos_A57_defconfig
          if [ ! -f $DEFCONFIG ]; then DEFCONFIG=arch/arm64/configs/lineageos_R9s_defconfig; fi
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "# CONFIG_KPM is not set" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> $DEFCONFIG
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_INFO is not set" >> $DEFCONFIG
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' $DEFCONFIG || true

      - name: Setup Toolchains
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          make O=out -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-g0"

      - name: Make TWRP ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/test-keys/release-keys/g' anykernel.sh
          zip -r9 ../A57-KSU-0.9.5-TWRP.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: A57-KSU-0.9.5-FULL
          path: |
            A57-KSU-0.9.5-TWRP.zip
            out/arch/arm64/boot/Image*
