name: Build A57 FINAL B
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lineage-21
          fetch-depth: 0
      - name: Build via a57-build.sh
        run: |
          chmod +x a57-build.sh
          bash a57-build.sh
      - name: Upload LOG
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-B
          path: build.log
      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: A57-SUKISU-v3.2.4-FINAL-B
          path: A57-SUKISU-v3.2.4-FINAL.zip
