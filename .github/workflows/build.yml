name: Build SukiSU A57 DUAL - FAST + FULL FIX

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: [FAST, FULL]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-21
          fetch-depth: 0

      - name: Patch SukiSU Ultra + SUSFS
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          git clone https://gitlab.com/simonpunk/susfs4ksu.git --depth=1 susfs4ksu || true
          cd susfs4ksu || exit 0
          bash kernel/setup.sh ../KernelSU 2>&1 || true
          cd ..

      - name: Set Defconfig A57 + SUSFS
        run: |
          DEFCONFIG=arch/arm64/configs/lineageos_A57_defconfig
          if [ ! -f $DEFCONFIG ]; then DEFCONFIG=arch/arm64/configs/lineageos_R9s_defconfig; fi
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> $DEFCONFIG
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> $DEFCONFIG

      - name: Cache Clang FULL
        if: matrix.variant == 'FULL'
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r536225-full

      - name: Setup Clang FAST
        if: matrix.variant == 'FAST'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup Clang FULL
        if: matrix.variant == 'FULL'
        run: |
          if [ "${{ steps.cache-clang.outputs.cache-hit }}" != "true" ]; then
            mkdir -p $HOME/clang
            wget -q https://android.googlesource.[STRIPPED 82 bytes].tar.gz -O /tmp/clang.tar.gz
            tar -xzf /tmp/clang.tar.gz -C $HOME/clang
            rm /tmp/clang.tar.gz
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          make O=out -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Make TWRP ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../SukiSU-A57-${{ matrix.variant }}-TWRP.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-A57-${{ matrix.variant }}
          path: |
            SukiSU-A57-${{ matrix.variant }}-TWRP.zip
            out/arch/arm64/boot/Image.gz-dtb
