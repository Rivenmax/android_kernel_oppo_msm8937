name: Build SukiSU A57 FINAL + SUSFS

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-21
          fetch-depth: 0

      - name: Patch SukiSU Ultra + SUSFS FIX 404
        run: |
          # 1. SukiSU Ultra main branch (tanpa susfs-main biar gak 404)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # 2. SUSFS4KSU via git clone (anti 404)
          echo "Cloning susfs4ksu..."
          git clone https://github.com/sidex15/susfs4ksu.git --depth=1
          cd susfs4ksu
          # Patch SUSFS ke KernelSU folder
          bash kernel/setup.sh ../KernelSU 2>&1 || bash ./kernel/setup.sh ../KernelSU 2>&1
          cd ..
          echo "SUSFS patched"

      - name: Set Defconfig A57 + SUSFS
        run: |
          DEFCONFIG=arch/arm64/configs/lineageos_A57_defconfig
          if [ ! -f $DEFCONFIG ]; then DEFCONFIG=arch/arm64/configs/lineageos_R9s_defconfig; fi
          echo "Using defconfig: $DEFCONFIG"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          # SUSFS configs - ini yang bikin Play Protect jadi Disertifikasi
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> $DEFCONFIG

      - name: Setup Clang AOSP
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel A57
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out lineageos_A57_defconfig || make O=out lineageos_R9s_defconfig
          make O=out -j$(nproc)             ARCH=arm64             CC=clang             LD=ld.lld             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Make TWRP Flashable ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          # Ganti test-keys jadi release-keys
          sed -i 's/test-keys/release-keys/g' anykernel.sh 2>/dev/null || true
          zip -r9 ../SukiSU-A57-SUSFS-FIXED-TWRP.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Artifact ANTI 403
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-A57-SUSFS-FIXED
          path: |
            SukiSU-A57-SUSFS-FIXED-TWRP.zip
            out/arch/arm64/boot/Image.gz-dtb
